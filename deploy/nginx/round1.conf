events {}
http {
  log_format correlated '$request_id $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log correlated;
  upstream next_app { server next:3000; }
  upstream bff_app { server bff:8080; }
  server {
    listen 80;
    client_max_body_size 4m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 210s;
    proxy_send_timeout 210s;
    proxy_next_upstream off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Coach-Internal-Token "";
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $request_id always;
    location = /api/coach/review {
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_pass http://bff_app;
    }
    location /api/coach/ { proxy_pass http://bff_app; }
    location = /api/workbench/run { proxy_pass http://bff_app; }
    location /api/mock-interview/ { proxy_pass http://bff_app; }
    location / {
      proxy_set_header Host next:3000;
      # Next Server Actions compare X-Forwarded-Host with the browser Origin;
      # Host stays next:3000 for proxy.ts while this carries the public host.
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Coach-Internal-Token "";
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";
      proxy_pass http://next_app;
    }
  }
}
